[project]
name = "free-ai-gateway"
version = "1.0.0"
description = "Universal OpenAI-Compatible Proxy Gateway for free AI models via local OpenCode bridge"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
]

[project.scripts]
free-ai = "free_ai.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
